version: "3.8"

services:
  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multi-agent-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=multi-agent-research-assistant
      - APP_ENV=production
      - APP_DEBUG=false
      - RESEARCH_MEMORY_DB_PATH=/app/data/research_memory.db
      - EVALUATION_METRICS_DB_PATH=/app/data/evaluation_metrics.db
      # OLLAMA_HOST configured to use internal Ollama service
      - OLLAMA_HOST=http://ollama:11434
    env_file:
      - .env
    volumes:
      # Persistent SQLite databases
      - app_data:/app/data
      # Persistent logs
      - app_logs:/app/logs
    networks:
      - app-network
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: multi-agent-ollama
    ports:
      - "11434:11434"
    volumes:
      # Persistent Ollama models
      - ollama_models:/root/.ollama
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # GPU support (uncomment if GPU available)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  app-network:
    driver: bridge

volumes:
  app_data:
  app_logs:
  ollama_models:
