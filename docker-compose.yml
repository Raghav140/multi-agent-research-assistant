services:
  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multi-agent-backend
    environment:
      - APP_NAME=multi-agent-research-assistant
      - APP_ENV=production
      - APP_DEBUG=false
      - RESEARCH_MEMORY_DB_PATH=/app/data/research_memory.db
      - EVALUATION_METRICS_DB_PATH=/app/data/evaluation_metrics.db
      # OLLAMA_HOST configured to use internal Ollama service
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=qwen3:4b
      - OLLAMA_TIMEOUT=120
      - OLLAMA_DISABLE_REASONING=true
      - OLLAMA_STREAM=false
      - OLLAMA_REPORT_TEMPERATURE=0.3
      - OLLAMA_REPORT_MAX_TOKENS=384
      - OLLAMA_REPORT_TIMEOUT=60
      # CORS origins - configure for production domain, e.g., CORS_ORIGINS=["https://your-domain.example"]
      # For same-domain deployment (frontend and API on same domain), set to CORS_ORIGINS=[]
      - CORS_ORIGINS=[]
    volumes:
      # Persistent SQLite databases
      - app_data:/app/data
      # Persistent application logs
      - app_logs:/app/logs
    networks:
      - app-network
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: multi-agent-ollama
    volumes:
      # Persistent Ollama models
      - ollama_models:/root/.ollama
      # Entrypoint script for model initialization
      - ./docker/ollama-entrypoint.sh:/entrypoint.sh:ro
    networks:
      - app-network
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    # GPU support (uncomment if GPU available)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Frontend with nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: multi-agent-frontend
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  app_data:
  app_logs:
  ollama_models:
